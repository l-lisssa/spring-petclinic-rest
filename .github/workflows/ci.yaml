name: Build and Test Petclinic REST

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Maven Build & Unit Tests
    runs-on: [self-hosted, kind-runner]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Grant Execute Permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Build & Run Tests
        run: ./mvnw clean test

      - name: Package JAR
        run: ./mvnw package -DskipTests
